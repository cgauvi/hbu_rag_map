name: Unit Tests

on:
  push:
    branches: ["main", "master", "develop"]
    paths:
      - "src/**"
      - "app.py"
      - "Dockerfile"
      - "requirements*.txt"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "src/**"
      - "app.py"
      - "Dockerfile"
      - "requirements*.txt"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: test
          load: true
          tags: hbu-rag-map-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run unit tests
        run: docker run --rm hbu-rag-map-test:latest
